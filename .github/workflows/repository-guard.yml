name: Repository secret guard
on:
  push:
  pull_request:
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check tracked source for obvious private files and credentials
        run: python repo_guard.py
      - name: Test scanner
        run: python -m unittest -v test_repo_guard.py
