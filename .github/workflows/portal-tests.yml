name: Portal security tests
on:
  push:
  pull_request:
jobs:
  portal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    env:
      V3_LOCAL_DEV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install web framework
        run: python -m pip install -r requirements-portal.txt
      - name: Check framework configuration and schema
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run isolated portal tests
        run: python manage.py test catalog_portal --verbosity 2
